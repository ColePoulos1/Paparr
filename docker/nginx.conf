geo $trusted_proxy {
    default 0;
    include /tmp/paparr-trusted-proxies.conf;
}

map "$trusted_proxy:$http_x_forwarded_proto" $public_scheme {
    default $scheme;
    "1:https" https;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://paparr-api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_read_timeout 120s;
    }

    location /health/ {
        proxy_pass http://paparr-api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
