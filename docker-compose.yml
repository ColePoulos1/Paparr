services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: paparr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-paparr}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paparr -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  paparr-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      Database__Host: postgres
      Database__Name: ${POSTGRES_DB:-paparr}
      Database__User: paparr
      Database__Password: ${POSTGRES_PASSWORD}
      AllowedHosts: "${ALLOWED_HOSTS:-localhost;127.0.0.1;[::1]}"
      Authentication__Enabled: "${AUTHENTICATION_ENABLED:-true}"
      Authentication__PasswordHash: "${PAPARR_PASSWORD_HASH:-}"
      Authentication__SecureCookies: "${SECURE_COOKIES:-false}"
      Authentication__KeysPath: /data/keys
      ReverseProxy__TrustedNetworks: "${TRUSTED_PROXY_NETWORKS:-}"
      IngestPath: /ingest
      LibraryPath: /library
      DeleteSourceAfterImport: "${DELETE_SOURCE_AFTER_IMPORT:-false}"
      MetadataProvidersEnabled: "${METADATA_PROVIDERS_ENABLED:-true}"
    volumes:
      - ${HOST_INGEST_PATH:-./ingest}:/ingest
      - ${HOST_LIBRARY_PATH:-./library}:/library
      - auth-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  paparr-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PAPARR_PORT:-5173}:8080"
    environment:
      UI_TRUSTED_PROXY_NETWORKS: "${UI_TRUSTED_PROXY_NETWORKS:-}"
    depends_on:
      - paparr-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  auth-data:
